<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 聊天室客户端</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>💬 聊天室</h1>
            <div class="header-info">
                <span id="statusIndicator" class="status-offline">未连接</span>
                <span id="roomDisplay" class="room-info">未加入房间</span>
                <span id="userDisplay">未登录</span>
                <button onclick="leaveRoom()">退出房间</button>
            </div>
        </div>

        <!-- 操作区域 -->
        <div class="join-section">
            <input type="text" id="usernameInput" placeholder="输入用户名">
            <input type="text" id="roomInput" placeholder="输入房间号加入">
            <button onclick="createRoom()">创建房间</button>
            <button onclick="joinRoom()">加入房间</button>
            <button onclick="getRoomUsers()" class="btn-secondary">房间用户</button>
        </div>

        <!-- 错误消息 -->
        <div id="errorMessage" class="error-message"></div>

        <!-- 消息显示区域 -->
        <div class="messages" id="messages">
            <div class="message system">
                <div class="content">欢迎来到聊天室！创建或加入房间开始聊天吧</div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-section">
            <input type="text" id="messageInput" placeholder="请先加入房间" disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
        </div>
    </div>

    <!-- 用户列表弹出窗口 -->
    <div id="userModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>👥 房间用户</h2>
                <span class="close" onclick="closeUserModal()">&times;</span>
            </div>
            <div class="modal-body" id="userList">
                <p>加载中...</p>
            </div>
            <div class="modal-footer">
                <button onclick="closeUserModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 服务器配置 -->
    <input type="hidden" id="serverConfig" value="{{ server_url }}">

    <!-- Socket.IO库 -->
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <!-- 聊天室脚本 -->
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
